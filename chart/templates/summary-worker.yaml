apiVersion: v1
kind: Service
metadata:
  name: summary-worker
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: summary-worker
  ports:
    - port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: summary-worker
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: summary-worker
  template:
    metadata:
      labels:
        app: summary-worker
    spec:
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret }}
      containers:
        - name: summary-worker
          image: {{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: worker-env
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 20
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
