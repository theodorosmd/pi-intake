# Passerelle d'appel : le seul service exposé à Internet (voir ingress.yaml).
# Dossiers, rendez-vous et résumés sont dans Postgres (base intake). Toujours 1 seul replica :
# l'état d'un appel en cours (conversation, flux audio) vit encore dans la mémoire du processus.
apiVersion: v1
kind: Service
metadata:
  name: intake-gateway
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: intake-gateway
  ports:
    - port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: intake-gateway
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  strategy:
    type: Recreate   # pas deux copies en même temps pendant une mise à jour (appels en cours en mémoire)
  selector:
    matchLabels:
      app: intake-gateway
  template:
    metadata:
      labels:
        app: intake-gateway
    spec:
      imagePullSecrets:
        - name: {{ .Values.imagePullSecret }}
      # Attend que la base intake existe et accepte l'utilisateur intake (créés par le Job intake-db-init).
      initContainers:
        - name: attendre-la-base
          image: {{ .Values.postgres.image }}
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: intake-db
                  key: PASSWORD
          command: ["bash", "-c", "until psql -h litellm-db -U intake -d intake -c 'select 1' >/dev/null 2>&1; do echo 'base intake pas prête'; sleep 3; done"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
      containers:
        - name: gateway
          image: {{ .Values.gateway.image.repository }}:{{ .Values.gateway.image.tag }}
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: gateway-env
          env:
            - name: PUBLIC_HOST
              value: {{ .Values.host }}
            - name: LLM_API_BASE
              value: http://litellm:4000
            - name: WORKER_URL
              value: http://summary-worker:8000
            - name: INTAKE_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: intake-db
                  key: PASSWORD
            - name: DATABASE_URL
              value: postgresql://intake:$(INTAKE_DB_PASSWORD)@litellm-db:5432/intake
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gateway-llm-key
                  key: LLM_API_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 20
          resources:
            {{- toYaml .Values.gateway.resources | nindent 12 }}
