# Passer à letsencrypt-prod une fois le certificat de test obtenu.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: intake-gateway
  namespace: intake
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - intake.theappstudio.co
      secretName: intake-tls
  rules:
    - host: intake.theappstudio.co
      http:
        paths:
          # Seules les routes Telnyx sont publiques ; /intake, /consultations, /call-ended et /docs
          # restent internes (la passerelle les appelle elle-même en local).
          - path: /telnyx
            pathType: Prefix
            backend:
              service:
                name: intake-gateway
                port:
                  number: 8000
