apiVersion: v1
kind: Namespace
metadata:
  name: labo
---
apiVersion: v1
kind: Pod
metadata:
  name: gourmand
  namespace: labo
spec:
  containers:
    - name: gourmand
      image: python:3.14-slim
      command: ["python", "-c", "x = bytearray(200 * 1024 * 1024); import time; time.sleep(600)"]
      resources:
        requests:
          memory: 32Mi
        limits:
          memory: 64Mi
