services:
  call-gateway:
    build: ../intake-py
    ports:
      - "8000:8000"
    environment:
      - WORKER_URL=http://summary-worker:8000
    depends_on:
      - summary-worker
  summary-worker:
    build: ../summary-worker
    ports:
      - "8001:8000"
    env_file:
      - ../summary-worker/.env
  litellm:
    image: docker.litellm.ai/berriai/litellm:latest
    command: ["--config", "/app/config.yaml"]
    ports:
      - "4000:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    env_file:
      - ./litellm/.env
    environment:
      # La base sert aux virtual keys : qui a le droit d'appeler quoi, avec quel budget.
      - DATABASE_URL=postgresql://litellm:litellm@litellm-db:5432/litellm
    depends_on:
      - litellm-db
  litellm-db:
    image: postgres:16
    environment:
      - POSTGRES_USER=litellm
      - POSTGRES_PASSWORD=litellm
      - POSTGRES_DB=litellm
    volumes:
      - litellm-db-data:/var/lib/postgresql/data

volumes:
  litellm-db-data:
